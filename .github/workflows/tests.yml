name: Python unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata database
        run: python -m unittest -v test_curriculum.py
      - name: Validate evidence catalogue
        run: python evidence.py
      - name: Test evidence validation
        run: python -m unittest -v test_evidence.py
      - name: Validate official book discoveries
        run: python discovery.py check
      - name: Test discovery registration and security
        run: python -m unittest -v test_discovery.py

      - name: Test book review permissions and audit
        run: python -m unittest -v test_review_workflow.py

      - name: Test read-only metadata search
        run: python -m unittest -v test_catalog_search.py

      - name: Test metadata coverage report
        run: python -m unittest -v test_coverage_report.py

      - name: Test metadata integrity audit
        run: python -m unittest -v test_metadata_audit.py

      - name: Test fail-closed retrieval eligibility
        run: python -m unittest -v test_retrieval_gate.py

      - name: Test manual curriculum manifest
        run: python -m unittest -v test_manual_manifest.py

      - name: Test manual collection progress report
        run: python -m unittest -v test_manifest_progress.py

      - name: Test manual book review queue
        run: python -m unittest -v test_manifest_review_queue.py

      - name: Test spreadsheet CSV cell safety
        run: python -m unittest -v test_manifest_cell_safety.py

      - name: Test manifest readiness fail-closed behavior
        run: python -m unittest -v test_manifest_readiness.py

      - name: Test manual upload checklist
        run: python -m unittest -v test_manual_upload_checklist.py

      - name: Test curriculum transfer and PDF integrity safeguards
        run: |
          python -m unittest -v test_transfer_preflight.py test_transfer_status_audit.py test_transfer_integrity_queue.py
          python -m unittest -v test_catalog_manifest_audit.py test_audit_pdf_integrity.py test_audit_curriculum_folders.py
