name: Python unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata database
        run: python -m unittest -v test_curriculum.py
      - name: Validate evidence catalogue
        run: python evidence.py
      - name: Test evidence validation
        run: python -m unittest -v test_evidence.py
      - name: Validate official book discoveries
        run: python discovery.py check
      - name: Test discovery registration and security
        run: python -m unittest -v test_discovery.py

      - name: Test book review permissions and audit
        run: python -m unittest -v test_review_workflow.py

      - name: Test read-only metadata search
        run: python -m unittest -v test_catalog_search.py

      - name: Test metadata coverage report
        run: python -m unittest -v test_coverage_report.py

      - name: Test metadata integrity audit
        run: python -m unittest -v test_metadata_audit.py
