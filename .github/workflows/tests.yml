name: Python unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata database
        run: python -m unittest -v test_curriculum.py
      - name: Validate evidence catalogue
        run: python evidence.py
      - name: Test evidence validation
        run: python -m unittest -v test_evidence.py
